[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-extractor"
version = "1.0.0"
description = "Ekstrak arsip .rpa (RPA-2.0/3.0/3.2/4.0) dari game Ren'Py"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
renpy-extractor = "renpy_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
